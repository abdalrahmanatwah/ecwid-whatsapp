services:
  - type: web
    name: ecwid-whatsapp
    runtime: node
    plan: starter            # always-on; required for the poller to run continuously
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data   # persists the "already messaged" record across restarts
      sizeGB: 1
    envVars:
      # Pre-set (safe, non-secret) values:
      - key: STORE_FILE
        value: /var/data/orders.json
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: DEFAULT_COUNTRY_CODE
        value: "20"
      - key: CONFIRM_FULFILLMENT_STATUS
        value: PROCESSING
      - key: CANCEL_PAYMENT_STATUS
        value: CANCELLED
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: GRAPH_VERSION
        value: v21.0
      # Secrets — Render will prompt you to enter these on deploy:
      - key: ECWID_STORE_ID
        sync: false
      - key: ECWID_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: MERCHANT_WHATSAPP
        sync: false
      # Dashboard (Bosta delivery rate, earnings, etc. — at /dashboard):
      - key: DASHBOARD_USER
        value: 499k
      - key: DASHBOARD_PASSWORD
        sync: false
      # Auto-ship (restored): creates the Bosta shipment automatically after the
      # grace window below, for single-item orders with a recognized city and an
      # Arabic-script address. Anything else falls back to manual, same as before.
      - key: AUTO_SHIP
        value: "true"
      - key: SHIP_DELAY_MIN
        value: "15"
      # Sales sheet sync (src/sheet_sync.js): delivered Bosta + QP orders → Google Sheet, hourly.
      - key: SALES_SHEET_ID
        value: 1DW0ggYJKDeSix1mqsMr3Lr5U7xGW4Y6yBzb5hLENbSw
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEET_SYNC_START
        value: "2026-10-22"
      - key: SHEET_SYNC_INTERVAL_MINUTES
        value: "60"
